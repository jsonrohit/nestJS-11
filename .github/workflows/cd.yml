name: CD

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script: |
            DEPLOY_DIR=${{ secrets.DEPLOY_PATH }}

            # Clone repo if not already cloned, otherwise pull latest
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              sudo git clone https://github.com/${{ github.repository }}.git $DEPLOY_DIR
            fi

            cd $DEPLOY_DIR
            sudo git pull origin master

            IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

            echo ${{ secrets.GHCR_TOKEN }} | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin

            sudo docker pull ghcr.io/${IMAGE_NAME}:latest

            # Check which compose command is available
            if command -v docker-compose &> /dev/null; then
              sudo docker-compose up -d --no-build
            elif sudo docker compose version &> /dev/null; then
              sudo docker compose up -d --no-build
            else
              echo "ERROR: Neither docker-compose nor docker compose plugin found. Installing..."
              sudo apt-get update && sudo apt-get install -y docker-compose-plugin
              sudo docker compose up -d --no-build
            fi

            sudo docker image prune -f

            sleep 15

            echo "=== All containers (including stopped) ==="
            sudo docker ps -a --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"

            echo "=== App logs ==="
            sudo docker logs nestjs_app --tail 30 2>&1 || echo "No app container found"

            echo "=== DB logs ==="
            sudo docker logs nestjs_db --tail 15 2>&1 || echo "No db container found"

            echo "=== Deploy complete ==="