name: CD

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script: |
            IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

            echo ${{ secrets.GHCR_TOKEN }} | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin

            sudo docker pull ghcr.io/${IMAGE_NAME}:latest

            # Create network if it doesn't exist
            sudo docker network create nestjs-net 2>/dev/null || true

            # Stop and remove old containers if they exist
            sudo docker rm -f nestjs_app 2>/dev/null || true
            sudo docker rm -f nestjs_db 2>/dev/null || true
            sudo docker rm -f phpmyadmin 2>/dev/null || true

            # Start MySQL (skip if already running)
            if ! sudo docker ps --format '{{.Names}}' | grep -q '^nestjs_db$'; then
              sudo docker run -d \
                --name nestjs_db \
                --network nestjs-net \
                --restart unless-stopped \
                -e MYSQL_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }} \
                -e MYSQL_DATABASE=${{ secrets.DB_NAME }} \
                -e MYSQL_USER=${{ secrets.DB_USER }} \
                -e MYSQL_PASSWORD=${{ secrets.DB_PASSWORD }} \
                -p 3306:3306 \
                -v mysql_data:/var/lib/mysql \
                mysql:8.0
            fi

            echo "Waiting for MySQL to be ready..."
            for i in $(seq 1 60); do
              if sudo docker exec nestjs_db mysqladmin ping -h localhost --silent 2>/dev/null; then
                echo "MySQL is accepting connections, waiting a bit more for full init..."
                sleep 10
                echo "MySQL is ready!"
                break
              fi
              echo "Waiting... ($i/60)"
              sleep 3
            done

            # Start phpMyAdmin
            sudo docker run -d \
              --name phpmyadmin \
              --network nestjs-net \
              --restart unless-stopped \
              -e PMA_HOST=nestjs_db \
              -e PMA_PORT=3306 \
              -p 8080:80 \
              phpmyadmin/phpmyadmin

            # Start the NestJS app
            sudo docker run -d \
              --name nestjs_app \
              --network nestjs-net \
              --restart unless-stopped \
              -e PORT=8888 \
              -e DATABASE_URL="mysql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@nestjs_db:3306/${{ secrets.DB_NAME }}" \
              -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
              -e JWT_EXPIRATION=3600s \
              -p 8888:8888 \
              ghcr.io/${IMAGE_NAME}:latest

            sudo docker image prune -f

            sleep 15

            echo "=== Running containers ==="
            sudo docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"

            echo "=== App logs ==="
            sudo docker logs nestjs_app --tail 30 2>&1

            echo "=== Deploy complete ==="